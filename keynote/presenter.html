<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Presenter — Bioadaptabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0a; --panel:#131410; --ink:#f4f1e8; --ink-dim:rgba(244,241,232,.62);
    --ink-faint:rgba(244,241,232,.36); --accent:#c9a15a; --line:rgba(244,241,232,.12);
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); height:100vh; overflow:hidden; }
  #wrap{ display:grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: auto 1fr; height:100vh; gap:1px; background:var(--line); }
  header{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--panel); }
  header .brand{ font-family:var(--serif); font-style:italic; font-size:18px; }
  header .stats{ display:flex; gap:26px; align-items:center; font-variant-numeric:tabular-nums; }
  header .stats .n{ font-size:22px; font-weight:600; }
  header .stats .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); display:block; }
  #left{ background:var(--bg); padding:26px 30px; overflow:auto; }
  #right{ background:var(--panel); display:flex; flex-direction:column; }
  .card{ background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:16px; }
  .kicker{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .curr-title{ font-family:var(--serif); font-size:30px; line-height:1.15; white-space:pre-line; margin:0 0 6px; }
  .curr-sub{ color:var(--ink-dim); font-size:15px; margin:0; }
  #next-card .curr-title{ font-size:19px; color:var(--ink-dim); font-style:italic; }
  #next-card .kicker{ color:var(--ink-faint); }
  #notes{ flex:1; overflow:auto; padding:22px 24px; font-size:16px; line-height:1.65; color:var(--ink-dim); }
  #notes h3{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); margin:0 0 10px; }
  #controls{ display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--line); }
  button{ font-family:var(--sans); font-size:13px; font-weight:600; padding:10px 18px; border-radius:8px;
    border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--ink); cursor:pointer; }
  button:hover{ background:rgba(255,255,255,.09); }
  .hint{ padding:0 22px 16px; font-size:11px; color:var(--ink-faint); }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">Bioadaptabilidad · presenter</div>
    <div class="stats">
      <div><span class="n" id="stat-counter">01 / 40</span><span class="lbl">Slide</span></div>
      <div><span class="n" id="stat-timer">00:00</span><span class="lbl">Tiempo</span></div>
      <div><span class="n" id="stat-clock">--:--</span><span class="lbl">Hora</span></div>
    </div>
  </header>
  <div id="left">
    <div class="card">
      <div class="kicker" id="curr-kicker"></div>
      <div class="curr-title" id="curr-title">Cargando…</div>
      <p class="curr-sub" id="curr-sub"></p>
    </div>
    <div class="card" id="next-card">
      <div class="kicker">Siguiente</div>
      <div class="curr-title" id="next-title"></div>
    </div>
  </div>
  <div id="right">
    <div id="notes"><h3>Notas del speaker</h3><div id="notes-body">Esperando a la presentación…</div></div>
    <div id="controls">
      <button id="p-prev">← Anterior</button>
      <button id="p-next">Siguiente →</button>
    </div>
    <div class="hint">Este panel se mantiene sincronizado con la ventana de presentación. Ábrelo en tu laptop mientras la ventana principal se proyecta en pantalla completa.</div>
  </div>
</div>

<script>
  let startTime = null, total = 40;
  function fmt(ms){
    const s = Math.max(0, Math.floor(ms/1000));
    const m = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    return m+':'+ss;
  }
  function tick(){
    if (startTime) document.getElementById('stat-timer').textContent = fmt(Date.now()-startTime);
    const now = new Date();
    document.getElementById('stat-clock').textContent =
      String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  }
  setInterval(tick, 1000); tick();

  window.addEventListener('message', (e)=>{
    const d = e.data || {};
    if (d.type !== 'state') return;
    startTime = d.startTime || startTime;
    total = d.total || total;
    document.getElementById('stat-counter').textContent =
      String(d.index+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
    document.getElementById('curr-kicker').textContent = d.current.kicker;
    document.getElementById('curr-title').textContent = d.current.title;
    document.getElementById('curr-sub').textContent = d.current.sub;
    document.getElementById('notes-body').textContent = d.current.notes || '(Sin notas)';
    document.getElementById('next-title').textContent = d.next ? d.next.title.replace(/\n/g,' ') : '— Fin de la presentación —';
  });

  function send(type){ if (window.opener) window.opener.postMessage({type}, '*'); }
  document.getElementById('p-next').addEventListener('click', ()=>send('nav-next'));
  document.getElementById('p-prev').addEventListener('click', ()=>send('nav-prev'));
  document.addEventListener('keydown', (e)=>{
    if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); send('nav-next'); }
    else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); send('nav-prev'); }
  });

  if (window.opener) window.opener.postMessage({type:'presenter-ready'}, '*');
</script>
</body>
</html>
