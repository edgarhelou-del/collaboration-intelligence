<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bioadaptabilidad — CENIT</title>
<meta name="description" content="Keynote: Bioadaptabilidad en el mundo corporativo. No podemos cambiar el futuro, pero sí la manera en que nos enfrentamos al cambio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="viewport">
  <div id="stage" class="stage" data-act="toyota">
    <!-- slides injected by app.js -->
    <div id="chrome">
      <div id="act-label"></div>
      <div id="counter"></div>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div class="navzone left" id="nav-left" aria-label="Anterior"></div>
      <div class="navzone right" id="nav-right" aria-label="Siguiente"></div>
      <button class="navbtn prev" id="btn-prev" aria-label="Slide anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="navbtn next" id="btn-next" aria-label="Siguiente slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div id="notes-overlay">
      <h2>Notas del speaker &nbsp;·&nbsp; presiona N para cerrar</h2>
      <div class="notes-title"></div>
      <div class="notes-body"></div>
      <div class="notes-hint">
        <kbd>N</kbd> cerrar notas &nbsp; <kbd>←</kbd><kbd>→</kbd> navegar &nbsp; <kbd>P</kbd> modo presentador &nbsp; <kbd>F</kbd> pantalla completa
      </div>
    </div>
  </div>
</div>

<div id="splash">
  <h1>Bioadaptabilidad</h1>
  <p>Un keynote sobre cómo sobrevive lo que sabe cambiar. 40 slides · CENIT.</p>
  <button id="btn-start">Comenzar presentación</button>
  <div class="kbd-hint">
    <kbd>←</kbd><kbd>→</kbd> avanzar &nbsp;·&nbsp; <kbd>N</kbd> notas del speaker &nbsp;·&nbsp; <kbd>P</kbd> modo presentador &nbsp;·&nbsp; <kbd>F</kbd> pantalla completa
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
